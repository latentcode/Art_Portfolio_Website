{% assign optimized = site.data.image_manifest.images[include.src] -%}
{% if optimized -%}
<img src="{{ optimized.fallback }}"
     srcset="{% for variant in optimized.variants %}{{ variant.src }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}"
     sizes="{{ include.sizes | default: '(max-width: 820px) calc(100vw - 40px), 600px' }}"
     width="{{ optimized.width }}"
     height="{{ optimized.height }}"
     loading="{{ include.loading | default: 'lazy' }}"
     decoding="async"{% if include.fetchpriority %}
     fetchpriority="{{ include.fetchpriority }}"{% endif %}{% if include.class %}
     class="{{ include.class }}"{% endif %}
     alt="{{ include.alt | default: '' | escape }}">
{% else -%}
<img src="{{ include.src }}"
     loading="{{ include.loading | default: 'lazy' }}"
     decoding="async"{% if include.class %}
     class="{{ include.class }}"{% endif %}
     alt="{{ include.alt | default: '' | escape }}">
{% endif -%}
